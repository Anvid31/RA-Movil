<div class="login-container">
  <!-- Left side - Red background with FESC branding -->
  <div class="login-left">
    <div class="branding">
      <h1 class="fesc-title">FESC</h1>
      <p class="fesc-subtitle">EDUCACIÓN SUPERIOR</p>
      <div class="comfanorte-logo">
        <span class="comfanorte-text">Comfanorte</span>
      </div>
    </div>
  </div>

  <!-- Right side - White background with login form -->
  <div class="login-right">
    <div class="login-form-container">
      <h2 class="login-title">Inicio de Sesion</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Usuario -->
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <input
            type="text"
            formControlName="username"
            class="form-input"
            placeholder="Admin" />
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input
            type="password"
            formControlName="password"
            class="form-input"
            placeholder="••••••••" />
        </div>

        <!-- Botón -->
        <button type="submit" class="login-button">
          Iniciar Sesion
        </button>
      </form>
    </div>
  </div>
</div>
